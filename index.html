<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestion des Formations — CJLE Bénin</title>
<meta name="description" content="Gestion des Formations — CJLE Bénin" />
<meta name="theme-color" content="#0606AA" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/x-icon" href="./icons/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
<style>
  html, body { margin: 0; padding: 0; background: #F3F5F8; }
  #root { min-height: 100vh; }

  /* ===== Auth overlay (ajouté — n'affecte pas le design de l'application) ===== */
  :root {
    --cjle-blue: #0606AA;
    --cjle-blue-light: #2323A1;
    --cjle-orange: #FA6501;
  }
  #cjle-auth-overlay {
    position: fixed; inset: 0; z-index: 999999;
    background: linear-gradient(135deg,var(--cjle-blue),var(--cjle-blue-light));
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 20px; box-sizing: border-box;
  }
  #cjle-auth-overlay.cjle-hidden { display: none; }
  .cjle-auth-card {
    background: #fff; width: 100%; max-width: 380px; border-radius: 16px;
    padding: 28px 28px 32px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    box-sizing: border-box;
  }
  .cjle-auth-card img.cjle-logo {
    display: block; margin: 0 auto 12px; width: 96px; height: auto;
  }
  .cjle-auth-card h1 {
    font-size: 18px; margin: 0 0 4px; color: var(--cjle-blue); text-align: center;
  }
  .cjle-auth-card p.cjle-sub {
    margin: 0 0 22px; text-align: center; color: #64748b; font-size: 13px;
  }
  .cjle-field { margin-bottom: 14px; }
  .cjle-field label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 5px; }
  .cjle-field input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 9px;
    border: 1.5px solid #cbd5e1; font-size: 14px; outline: none;
  }
  .cjle-field input:focus { border-color: var(--cjle-blue); }
  #cjle-auth-error {
    display: none; background: #fff4ec; color: #b3480a; border: 1px solid #ffd3b0;
    padding: 8px 10px; border-radius: 8px; font-size: 12.5px; margin-bottom: 14px;
  }
  #cjle-auth-submit {
    width: 100%; padding: 11px; border: none; border-radius: 9px; background: var(--cjle-orange);
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  #cjle-auth-submit:active { background: #d95700; }

  /* ===== Bandeau de session (ajouté) ===== */
  #cjle-session-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99998;
    display: none; align-items: center; justify-content: space-between;
    padding: 6px 14px; font: 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #fff; box-sizing: border-box;
  }
  #cjle-session-bar img.cjle-logo-mini { height: 18px; width: auto; vertical-align: middle; margin-right: 8px; }
  #cjle-session-bar.cjle-role-admin { background: var(--cjle-blue); }
  #cjle-session-bar.cjle-role-observateur { background: var(--cjle-orange); }
  #cjle-session-bar span { opacity: .95; display: inline-flex; align-items: center; }
  #cjle-session-bar button {
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4); color: #fff;
    border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  body.cjle-logged-in #root { padding-top: 28px; box-sizing: border-box; }
</style>
</head>
<body>

<!-- ===== Écran de connexion (ajouté) ===== -->
<div id="cjle-auth-overlay">
  <div class="cjle-auth-card">
    <img class="cjle-logo" src="./icons/logo.png" alt="CJLE Bénin" />
    <h1>Gestion des Formations — CJLE Bénin</h1>
    <p class="cjle-sub">Connexion requise pour accéder à l'application</p>
    <div id="cjle-auth-error">Email ou mot de passe incorrect.</div>
    <form id="cjle-auth-form" autocomplete="on">
      <div class="cjle-field">
        <label for="cjle-auth-email">Adresse email</label>
        <input type="email" id="cjle-auth-email" autocomplete="username" required />
      </div>
      <div class="cjle-field">
        <label for="cjle-auth-password">Mot de passe</label>
        <input type="password" id="cjle-auth-password" autocomplete="current-password" required />
      </div>
      <button type="submit" id="cjle-auth-submit">Se connecter</button>
    </form>
  </div>
</div>

<!-- ===== Bandeau de session (ajouté) ===== -->
<div id="cjle-session-bar">
  <span id="cjle-session-label"><img class="cjle-logo-mini" src="./icons/logo.png" alt="" /><span id="cjle-session-text"></span></span>
  <button id="cjle-session-logout">Déconnexion</button>
</div>

<div id="root"></div>

<!-- ===== Script d'authentification (ajouté — ne modifie pas le bundle ci-dessous) ===== -->
<script>
(function(){
  "use strict";

  // Comptes autorisés
  var ACCOUNTS = {
    "samuelavocetien27@gmail.com": { password: "Sam@9103",      role: "admin",       label: "Administrateur" },
    "cjlebenin@gmail.com":         { password: "Direction @5379", role: "observateur", label: "Observateur" }
  };

  var AUTH_KEY = "cjle_auth_session_v1"; // clé distincte de celle utilisée par l'application (cjle_gestion_formations_v1)
  var APP_DATA_KEY = "cjle_gestion_formations_v1";

  function getSession(){
    try {
      var raw = localStorage.getItem(AUTH_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function setSession(session){
    try { localStorage.setItem(AUTH_KEY, JSON.stringify(session)); } catch(e){}
  }
  function clearSession(){
    try { localStorage.removeItem(AUTH_KEY); } catch(e){}
  }

  window.__CJLE_SESSION__ = getSession();

  // --- Verrouillage des données pour le compte Observateur ---
  // Garantie principale : aucune écriture n'est jamais persistée pour ce compte,
  // quel que soit ce qui se passe visuellement dans l'interface.
  var _origSetItem = Storage.prototype.setItem;
  var _origRemoveItem = Storage.prototype.removeItem;
  var _origClear = Storage.prototype.clear;
  Storage.prototype.setItem = function(key, value){
    var s = window.__CJLE_SESSION__;
    if (this === window.localStorage && s && s.role === "observateur" && key === APP_DATA_KEY) {
      return; // écriture bloquée en mode Observateur
    }
    return _origSetItem.call(this, key, value);
  };
  Storage.prototype.removeItem = function(key){
    var s = window.__CJLE_SESSION__;
    if (this === window.localStorage && s && s.role === "observateur" && key === APP_DATA_KEY) {
      return;
    }
    return _origRemoveItem.call(this, key);
  };
  Storage.prototype.clear = function(){
    var s = window.__CJLE_SESSION__;
    if (this === window.localStorage && s && s.role === "observateur") {
      return;
    }
    return _origClear.call(this);
  };

  // --- Renfort visuel pour le mode Observateur : empêche la saisie/les cases à cocher ---
  // (protection secondaire ; la vraie garantie est le verrou de stockage ci-dessus)
  function isObserver(){
    var s = window.__CJLE_SESSION__;
    return !!(s && s.role === "observateur");
  }
  ["beforeinput","paste","drop"].forEach(function(evt){
    document.addEventListener(evt, function(e){
      if (isObserver() && /^(INPUT|TEXTAREA)$/.test((e.target && e.target.tagName)||"")) {
        e.preventDefault(); e.stopPropagation();
      }
    }, true);
  });
  document.addEventListener("keydown", function(e){
    if (!isObserver()) return;
    var tag = (e.target && e.target.tagName) || "";
    if (/^(INPUT|TEXTAREA)$/.test(tag)) {
      var allowed = ["Tab","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End","PageUp","PageDown","Escape"];
      var isCopy = (e.ctrlKey||e.metaKey) && (e.key==="c"||e.key==="C"||e.key==="a"||e.key==="A");
      if (allowed.indexOf(e.key)===-1 && !isCopy){
        e.preventDefault(); e.stopPropagation();
      }
    }
  }, true);
  document.addEventListener("click", function(e){
    if (!isObserver()) return;
    var t = e.target;
    if (t && (t.tagName==="INPUT") && (t.type==="checkbox"||t.type==="radio")) {
      e.preventDefault(); e.stopPropagation();
    }
  }, true);
  document.addEventListener("change", function(e){
    if (!isObserver()) return;
    var t = e.target;
    if (t && t.tagName==="SELECT") {
      var prev = t.getAttribute("data-cjle-prev");
      if (prev !== null) t.value = prev;
      e.stopPropagation();
    }
  }, true);
  document.addEventListener("focusin", function(e){
    var t = e.target;
    if (t && t.tagName==="SELECT") t.setAttribute("data-cjle-prev", t.value);
  }, true);

  // --- Interface de connexion ---
  var overlay = document.getElementById("cjle-auth-overlay");
  var form = document.getElementById("cjle-auth-form");
  var errBox = document.getElementById("cjle-auth-error");
  var sessionBar = document.getElementById("cjle-session-bar");
  var sessionLabel = document.getElementById("cjle-session-label");
  var sessionText = document.getElementById("cjle-session-text");
  var logoutBtn = document.getElementById("cjle-session-logout");

  function applySession(session){
    window.__CJLE_SESSION__ = session;
    if (session) {
      overlay.classList.add("cjle-hidden");
      document.body.classList.add("cjle-logged-in");
      sessionBar.style.display = "flex";
      sessionBar.className = "cjle-role-" + session.role;
      sessionText.textContent = (session.role === "admin" ? "🟢 Administrateur" : "🔒 Observateur — lecture seule") + " · " + session.email;
    } else {
      overlay.classList.remove("cjle-hidden");
      document.body.classList.remove("cjle-logged-in");
      sessionBar.style.display = "none";
    }
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var email = document.getElementById("cjle-auth-email").value.trim().toLowerCase();
    var pass = document.getElementById("cjle-auth-password").value;
    var acc = ACCOUNTS[email];
    if (acc && acc.password === pass) {
      errBox.style.display = "none";
      var session = { email: email, role: acc.role, label: acc.label };
      setSession(session);
      applySession(session);
      form.reset();
    } else {
      errBox.style.display = "block";
    }
  });

  logoutBtn.addEventListener("click", function(){
    clearSession();
    applySession(null);
  });

  applySession(window.__CJLE_SESSION__);

  // Enregistrement du service worker (installation en app / mode hors-ligne basique)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";
  var SUPABASE_URL = "https://ldkdyfpziysfeblfvpvt.supabase.co";
  var SUPABASE_KEY = "sb_publishable_1DPEZQi3TST1rXNhPsS_oQ_i4fc1UdM";
  var APP_DATA_KEY = "cjle_gestion_formations_v1";
  var SYNC_FLAG = "cjle_synced_this_session_v1";
  if (!window.supabase || typeof window.supabase.createClient !== "function") return;
  var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var _rawSetItem = Storage.prototype.setItem;
  function pushToCloud(value){
    client.from("app_data").select("id").eq("key", APP_DATA_KEY).then(function(res){
      var rows = (res && res.data) || [];
      if (rows.length > 0) {
        client.from("app_data").update({ value: value }).eq("key", APP_DATA_KEY).then(function(){});
      } else {
        client.from("app_data").insert({ key: APP_DATA_KEY, value: value }).then(function(){});
      }
    }).catch(function(){});
  }
  var pushTimer = null;
  Storage.prototype.setItem = function(key, value){
    var result = _rawSetItem.call(this, key, value);
    if (this === window.localStorage && key === APP_DATA_KEY) {
      clearTimeout(pushTimer);
      pushTimer = setTimeout(function(){ pushToCloud(value); }, 1200);
    }
    return result;
  };
  if (sessionStorage.getItem(SYNC_FLAG)) return;
  client.from("app_data").select("value").eq("key", APP_DATA_KEY).then(function(res){
    sessionStorage.setItem(SYNC_FLAG, "1");
    var rows = (res && res.data) || [];
    if (rows.length > 0 && rows[0].value) {
      var remoteValue = rows[0].value;
      var localValue = localStorage.getItem(APP_DATA_KEY);
      if (remoteValue !== localValue) {
        _rawSetItem.call(localStorage, APP_DATA_KEY, remoteValue);
        location.reload();
      }
    } else {
      var localValue2 = localStorage.getItem(APP_DATA_KEY);
      if (localValue2) pushToCloud(localValue2);
    }
  }).catch(function(){
    sessionStorage.setItem(SYNC_FLAG, "1");
  });
})();
</script>
